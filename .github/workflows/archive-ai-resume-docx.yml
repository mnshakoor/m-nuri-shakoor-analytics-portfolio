name: Archive AI resume DOCX

on:
  push:
    paths:
      - '_resume_upload/**'

permissions:
  contents: write

jobs:
  assemble-docx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble DOCX when all chunks are present
        shell: bash
        run: |
          set -euo pipefail
          expected=8
          count=$(find _resume_upload -maxdepth 1 -type f -name 'chunk-*.b64' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" != "$expected" ]; then
            echo "Waiting for all $expected chunks; found $count."
            exit 0
          fi
          mkdir -p 05/Resume-CV
          cat _resume_upload/chunk-*.b64 | base64 -d > 05/Resume-CV/M_Nuri_Shakoor_Master_AI_Resume_2026.docx
          python - <<'PY'
          from zipfile import ZipFile
          p='05/Resume-CV/M_Nuri_Shakoor_Master_AI_Resume_2026.docx'
          with ZipFile(p) as z:
              assert '[Content_Types].xml' in z.namelist()
          print('DOCX validated')
          PY
          rm -rf _resume_upload
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 05/Resume-CV/M_Nuri_Shakoor_Master_AI_Resume_2026.docx _resume_upload
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Archive master AI resume DOCX'
          git push
