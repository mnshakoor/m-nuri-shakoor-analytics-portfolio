name: Archive AI resume DOCX

on:
  push:
    paths:
      - '_resume_upload/**'

permissions:
  contents: write

jobs:
  build-docx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build archival DOCX
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet python-docx
          python - <<'PY'
          from docx import Document
          from docx.shared import Inches, Pt, RGBColor
          from docx.enum.text import WD_ALIGN_PARAGRAPH
          from docx.enum.section import WD_SECTION
          from docx.enum.style import WD_STYLE_TYPE
          from docx.oxml import OxmlElement
          from docx.oxml.ns import qn
          from pathlib import Path

          out=Path('05/Resume-CV/M_Nuri_Shakoor_Master_AI_Resume_2026.docx')
          out.parent.mkdir(parents=True, exist_ok=True)
          doc=Document()
          sec=doc.sections[0]
          sec.top_margin=Inches(.42); sec.bottom_margin=Inches(.42); sec.left_margin=Inches(.55); sec.right_margin=Inches(.55)
          styles=doc.styles
          normal=styles['Normal']; normal.font.name='Aptos'; normal.font.size=Pt(8.4)
          normal.paragraph_format.space_after=Pt(2.2); normal.paragraph_format.line_spacing=1.0
          for name,size,color in [('Resume Section',10.5,'173049'),('Resume Job',9.2,'173049'),('Resume Org',8.2,'4B4E52')]:
              s=styles.add_style(name,WD_STYLE_TYPE.PARAGRAPH); s.font.name='Aptos'; s.font.size=Pt(size); s.font.color.rgb=RGBColor.from_string(color)
              if name!='Resume Org': s.font.bold=True
          def p(txt='',style=None,align=None):
              x=doc.add_paragraph(txt,style=style)
              if align is not None: x.alignment=align
              return x
          def bullet(txt):
              x=doc.add_paragraph(style='Normal'); x.paragraph_format.left_indent=Inches(.16); x.paragraph_format.first_line_indent=Inches(-.11)
              x.add_run('- '+txt); return x
          def section(title):
              x=p(title,'Resume Section'); x.paragraph_format.space_before=Pt(5); x.paragraph_format.space_after=Pt(2); return x
          def job(title,org,date,bullets):
              x=p(style='Resume Job'); x.add_run(title).bold=True; r=x.add_run('   '+date); r.font.bold=False; r.font.size=Pt(8.4)
              p(org,'Resume Org')
              for b in bullets: bullet(b)
          h=p(align=WD_ALIGN_PARAGRAPH.CENTER); r=h.add_run('M. NURI SHAKOOR'); r.bold=True; r.font.size=Pt(20); r.font.color.rgb=RGBColor(23,48,73)
          t=p('AI SYSTEMS ANALYST | AI STRATEGY & INTEGRATION CONSULTANT | HUMAN-AI WORKFLOW ARCHITECT',align=WD_ALIGN_PARAGRAPH.CENTER); t.runs[0].bold=True; t.runs[0].font.size=Pt(9); t.runs[0].font.color.rgb=RGBColor(154,117,54)
          p('New York, NY | ai_consultant@mnshakoor.com | (646) 657-8172 | portfolio.mnshakoor.com | quanta-analytica.com',align=WD_ALIGN_PARAGRAPH.CENTER)
          section('PROFESSIONAL PROFILE')
          p('AI systems analyst and technology consultant with 20+ years across information technology, systems analysis, data analytics, technical research, government contracting, security risk management, and emerging AI technologies. Specializes in human-in-the-loop AI workflows integrating LLMs, structured data, APIs, analytical frameworks, evidence validation, automation, and human review for research, risk, compliance, intelligence, and decision support.')
          section('CORE AI & DIGITAL TRANSFORMATION COMPETENCIES')
          bullet('AI Strategy & Systems: AI strategy and implementation, AI systems analysis, human-centered AI, HITL systems, workflow architecture, use-case development, AI-assisted decision support.')
          bullet('Generative & Agentic AI: LLMs, agentic workflow design, LLM orchestration, custom GPT development, prompt engineering, AI personas, knowledge bases.')
          bullet('AI Analysis & Assurance: AI-assisted research and OSINT, NLP, LLM evaluation, output verification, evidence provenance, source validation, confidence assessment.')
          bullet('Data, Governance & Adoption: OpenAI API, Python, R, SQL, Tableau, Power BI, responsible AI, process automation, technical documentation, SOPs, user training.')
          section('PROFESSIONAL EXPERIENCE')
          job('AI Systems & Strategy Consultant / Independent Contractor','Quanta Analytica / MNS Consulting | Remote','2023-Present',[
            'Design human-in-the-loop AI systems and analytical workflows integrating LLMs, structured data, APIs, analytical frameworks, evidence validation, and analyst review.',
            'Develop custom GPTs, AI personas, prompt architectures, knowledge bases, and structured LLM workflows supporting research, risk, compliance, NGO security, media analysis, and editorial operations.',
            'Translate organizational requirements into AI-enabled workflows, application concepts, governance controls, technical documentation, SOPs, and training resources.'
          ])
          job('Global Security Data Analyst & AI Systems Integration Specialist','ARAC International Inc. | Remote','2021-Present',[
            'Lead AI-assisted research and analytical workflows supporting geopolitical risk, conflict analysis, governance, humanitarian analysis, information integrity, and security risk management.',
            'Developed and operationalized the Quanta Analytica Process (QAP), integrating evidence management, structured analytic techniques, AI-assisted research, scenario development, confidence assessment, and decision-support reporting.',
            'Design human-machine analytical processes combining structured datasets, OSINT, LLM-assisted research, analyst adjudication, and evidence-based reporting.'
          ])
          job('AI Integration Consultant & Systems Research Consultant','Lladner Business Solutions, LLC | Remote / New York, NY','2023-Present',[
            'Design AI-enabled research, documentation, compliance, risk-management, knowledge-management, dashboard, and reporting workflows.',
            'Translate business and analytical requirements into practical LLM-enabled workflows, custom GPT tools, prompt libraries, and reporting systems.'
          ])
          job('Special Projects Research Analyst & Data Visualization Specialist - U.S. Government Contractor','Veracity Engineering LLC | Washington, DC','2005-2017',[
            'Supported FAA and National Airspace System modernization through systems research, requirements analysis, data validation, analytics, technical documentation, logistics analysis, and decision-support reporting.',
            'Developed analytical frameworks, dashboards, technical reports, white papers, briefing materials, and performance-monitoring tools for federal program offices and multi-contractor teams.'
          ])
          job('IT Technical Support Analyst & Systems Documentation Specialist - U.S. Government Contractor','Lockheed Martin / CSC / DynCorp International / KenRob Associates | Washington, DC','2000-2005',[
            'Supported federal IT, network, logistics, help-desk, data-management, access-control, continuity, systems documentation, asset management, and workflow-improvement operations.'
          ])
          section('SELECTED AI & DIGITAL SYSTEMS PROJECTS')
          for x in [
            'Quanta Analytica Process (QAP): Human-AI analytical methodology integrating evidence management, structured analytic techniques, AI-assisted research, scenarios, confidence assessment, QA, and decision-support reporting.',
            'Quanta Conflict Signal Workbench: AI-assisted conflict-analysis workflow integrating event data, signal detection, evidence validation, analyst adjudication, indicators, scenarios, and reporting.',
            'ARAC Global Stability Analytics Dashboard: Governance, fragility, and stability analytics with documented interpretation and decision-support workflows.',
            'MOSAIC Displacement Signal Console: IOM DTM-based displacement monitoring, signal detection, trend analysis, humanitarian access context, and analyst review.',
            'Africa Conflict Exposure Monitor: ACLED-based conflict analytics requirements covering interactive mapping, event taxonomy, Admin1/regional analysis, multi-year trends, and exports.',
            'AI-Assisted Data Analysis & Data Journalism Framework: Standardized workflow for data stories, geospatial products, AI-assisted investigations, visualization, provenance, verification, and publication-ready outputs.',
            'OpenAI GPT Store Contributor & Digital Navigator: Custom GPT assistants and AI governance/media-literacy content for sector-specific research and operational workflows.'
          ]: bullet(x)
          section('TECHNICAL SKILLS')
          bullet('Generative AI: ChatGPT, OpenAI API, custom GPTs, Anthropic Claude, Google AI Studio, LLM configuration, prompt architecture, AI personas, knowledge-base design.')
          bullet('AI & Analysis: NLP, content analysis, sentiment analysis, AI-assisted research, OSINT, LLM evaluation, AI output validation, structured analytic techniques, workflow automation.')
          bullet('Data & Visualization: Python, R, SQL, Excel, Tableau, Power BI, data curation, data quality assurance, dashboard development.')
          bullet('Systems & Governance: API integration, HTML, requirements analysis, technical documentation, responsible AI, HITL controls, evidence provenance, source validation, NIST/ISO-aligned workflows.')
          section('EDUCATION & PROFESSIONAL CREDENTIALS')
          for x in ['Security Risk Management Professional, INSSA SRMP-R / SRMP-C','Open-Source Intelligence, Basel Institute on Governance','Institute for Economics & Peace, Positive Peace Ambassador (April 2022 Cohort)','ITIL 4 Foundations, Technical Institute of America, 2017','Digital Marketing, Borough of Manhattan Community College, 2017','Information Technology: Network Design (CCDA), University of Maryland University College, 2003','Microsoft Certified Professional & CompTIA A+, ASM Educational Center, 1999','Interdisciplinary Studies, University of Virginia, 1985-1987']:
              bullet(x)
          for s in doc.sections:
              f=s.footer.paragraphs[0]; f.alignment=WD_ALIGN_PARAGRAPH.CENTER; rr=f.add_run('M. Nuri Shakoor | Master AI Resume | 2026'); rr.font.size=Pt(7); rr.font.color.rgb=RGBColor(115,115,115)
          doc.save(out)
          print(out)
          PY
          rm -rf _resume_upload
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 05/Resume-CV/M_Nuri_Shakoor_Master_AI_Resume_2026.docx _resume_upload
          git commit -m 'Archive master AI resume DOCX'
          git push
